name: Coletor M6 - Outorgas IGAM

# SEM AGENDAMENTO e sem execução automática: só roda quando alguém clica em "Run workflow".
# Lê o índice de portarias do IGAM, baixa os documentos .doc ainda não processados (mais recentes primeiro),
# converte para texto (LibreOffice), separa os atos e grava eventos. NÃO usa IA e NÃO publica nada: todo evento
# nasce em apuração (ou descartado, se a finalidade documentada for claramente não mineral) com revisão humana pendente.
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente (piloto | homologacao | producao)'
        required: false
        default: 'piloto'
      limite:
        description: 'Ler só os N documentos novos mais recentes (deixar vazio para todos — no primeiro uso, use 3)'
        required: false
        default: '3'

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Os documentos do IGAM são .doc (Word antigo): precisam do LibreOffice para virar texto
      - name: Instalar LibreOffice (conversão de .doc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Instalar dependências
        run: pip install -r coletores/m6_outorgas/requirements.txt

      - name: Rodar testes (não pode divergir do gabarito da Carta de Homologação M6-V1.0 nem dos documentos reais)
        working-directory: coletores/m6_outorgas
        run: |
          export GITHUB_STEP_SUMMARY=/dev/null   # testes simulam falhas; não podem poluir o resumo da execução real
          python -m unittest test_signals.py -v
          python -m unittest test_scoring.py -v
          python -m unittest test_regressao_m6.py -v
          python -m unittest test_coleta_m6.py -v

      - name: Rodar testes comuns (rotas de fontes, acesso/barreiras, diagnóstico, pré-IA)
        working-directory: coletores/comum
        run: |
          export GITHUB_STEP_SUMMARY=/dev/null
          python -m unittest test_acesso.py test_diagnostico.py test_pre_ia.py -v

      - name: Rodar coletor
        working-directory: coletores/m6_outorgas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RADAR_EMPRESA_ID: ${{ vars.RADAR_EMPRESA_ID }}
          RADAR_CARTEIRA_ID: ${{ vars.RADAR_CARTEIRA_ID }}
        run: |
          ARGS="--ambiente ${{ github.event.inputs.ambiente || 'piloto' }}"
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            ARGS="$ARGS --limite ${{ github.event.inputs.limite }}"
          fi
          python main.py $ARGS
