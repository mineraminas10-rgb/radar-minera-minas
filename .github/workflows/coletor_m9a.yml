name: Coletor M9A - Movimentacoes ANM

# Cadência não é fixada de forma explícita na Carta Operacional M9A (ela
# fala em "execução recorrente" e "reconciliação em nova data", sem cravar
# uma frequência como a do M8). Comecei com diário à noite (horário de
# menor tráfego) — CONFIRMAR com a Rapha se ela prefere outra cadência
# (ex.: semanal, já que o SCM não deve atualizar todo dia).
# SEM AGENDAMENTO: só roda quando alguém clica em "Run workflow" (decisão da Rapha, 09/10/2026).
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente (piloto | homologacao | producao)'
        required: false
        default: 'piloto'
      limite_casos:
        description: 'Tamanho do lote de casos; use offset_casos para continuar (padrão 100)'
        required: false
        default: '100'
      offset_casos:
        description: 'Índice inicial do lote, após a ordenação determinística (padrão 0)'
        required: false
        default: '0'
      max_linhas_evento:
        description: 'Modo amostra: ler só as N primeiras linhas de ProcessoEvento.txt (ex.: 200000)'
        required: false
        default: ''
      somente_existentes:
        description: 'Só atualiza casos que JÁ existem no banco; não cria nenhum evento novo (digite sim; vazio = comportamento normal)'
        required: false
        default: ''
      piso_criticidade:
        description: 'Menor criticidade aceita (vazio = padrão MEDIA; ROTINA = todos os níveis, use junto com somente_existentes para atualizar todos os casos que já estão no banco)'
        required: false
        default: ''

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r coletores/m9a_movimentacoes/requirements.txt

      - name: Rodar testes (carta, classificação SCM, leitura em blocos, download seguro, rodada completa)
        working-directory: coletores/m9a_movimentacoes
        run: |
          python -m unittest test_scoring.py -v
          python -m unittest test_consolidacao.py -v
          python -m unittest test_classificacao_scm.py -v
          python -m unittest test_signals.py -v
          python -m unittest test_checklist_editorial.py -v
          python -m unittest test_ingestao_blocos.py -v
          python -m unittest test_baixar_scm.py -v
          python -m unittest test_main_run.py -v

      - name: Rodar testes comuns (rotas de fontes, acesso/barreiras, diagnóstico, pré-IA)
        working-directory: coletores/comum
        run: |
          python -m unittest test_acesso.py test_diagnostico.py test_pre_ia.py -v

      - name: Diagnosticar certificado da ANM e completar a cadeia (verificação SSL continua LIGADA)
        # Só diagnostica e, se a ANM não enviar o certificado intermediário, busca-o no endereço (AIA) que o próprio
        # certificado do site informa. O intermediário só é aceito se encadear até uma raiz confiável (certifi).
        # Não desliga a verificação, não usa curl -k e não baixa dados. Se algo falhar, o passo seguinte roda como antes.
        continue-on-error: true
        run: |
          mkdir -p .scm_dump/certs && cd .scm_dump/certs
          CERTIFI="$(python -c 'import certifi; print(certifi.where())')"
          for H in dadosabertos.anm.gov.br app.anm.gov.br; do
            echo "=== $H"
            echo | openssl s_client -connect "$H:443" -servername "$H" -showcerts -CAfile "$CERTIFI" > "$H.txt" 2>&1 || true
            grep -E "^ *[0-9]+ s:|^ *i:|Verify return code|verify error|Protocol  :|Cipher    :" "$H.txt" || echo "(sem resposta TLS de $H)"
          done
          H=dadosabertos.anm.gov.br
          openssl x509 -in <(awk '/BEGIN CERTIFICATE/{f=1} f{print} /END CERTIFICATE/{exit}' "$H.txt") -out leaf.pem 2>/dev/null || { echo "não consegui ler o certificado do site"; exit 0; }
          if openssl verify -CAfile "$CERTIFI" leaf.pem >/dev/null 2>&1; then
            echo "Cadeia já completa: nada a corrigir."; exit 0
          fi
          AIA="$(openssl x509 -in leaf.pem -noout -text | grep -A1 'CA Issuers' | grep -o 'http[^ ]*' | head -1)"
          echo "Cadeia incompleta. Endereço do intermediário informado no certificado (AIA): ${AIA:-nenhum}"
          [ -n "$AIA" ] || exit 0
          curl -fsSL --max-time 30 "$AIA" -o inter.bin || { echo "falha ao baixar o intermediário"; exit 0; }
          openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || openssl x509 -inform PEM -in inter.bin -out inter.pem 2>/dev/null || { echo "intermediário ilegível"; exit 0; }
          if openssl verify -CAfile "$CERTIFI" -untrusted inter.pem leaf.pem; then
            cat "$CERTIFI" inter.pem > bundle.pem
            echo "REQUESTS_CA_BUNDLE=$PWD/bundle.pem" >> "$GITHUB_ENV"
            echo "OK: intermediário encadeia até uma raiz confiável; usando bundle.pem no download."
          else
            echo "Intermediário NÃO encadeia até uma raiz confiável: não será usado."
          fi

      - name: Baixar e validar microdados SCM (rota oficial, barreiras não contornadas)
        working-directory: coletores/m9a_movimentacoes
        run: |
          # Substitui o antigo `curl | unzip`: valida rota, status, MIME, tamanho, assinatura PK, integridade,
          # SHA-256, extrai só os 9 arquivos usados e confere os cabeçalhos. Cada etapa tem nome no log.
          python baixar_scm.py --destino ../../.scm_dump --registro-saida ../../.scm_dump/registro_download.json

      - name: Rodar coletor
        working-directory: coletores/m9a_movimentacoes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Escopo da coleta (isolamento por empresa). Definir em Settings > Variables > Actions.
          # Sem RADAR_EMPRESA_ID a coleta só roda se a fonte existir em UMA única empresa.
          RADAR_EMPRESA_ID: ${{ vars.RADAR_EMPRESA_ID }}
          RADAR_CARTEIRA_ID: ${{ vars.RADAR_CARTEIRA_ID }}
        run: |
          # Leitura em BLOCOS (ProcessoEvento.txt ~1 GB não cabe inteiro em memória no runner padrão).
          # Lotes pequenos e retomáveis evitam processar dezenas de milhares de casos num único job.
          # Este coletor NÃO chama IA; o score ponderado depende das rubricas e evidências da carteira.
          ARGS="--microdados ../../.scm_dump/microdados --registro-download ../../.scm_dump/registro_download.json --ambiente ${{ github.event.inputs.ambiente || 'piloto' }}"
          if [ -n "${{ github.event.inputs.limite_casos }}" ]; then
            ARGS="$ARGS --limite-casos ${{ github.event.inputs.limite_casos }}"
          fi
          if [ -n "${{ github.event.inputs.offset_casos }}" ]; then
            ARGS="$ARGS --offset-casos ${{ github.event.inputs.offset_casos }}"
          fi
          if [ -n "${{ github.event.inputs.max_linhas_evento }}" ]; then
            ARGS="$ARGS --max-linhas-evento ${{ github.event.inputs.max_linhas_evento }}"
          fi
          if [ "${{ github.event.inputs.somente_existentes }}" = "sim" ]; then
            ARGS="$ARGS --somente-existentes"
          fi
          if [ -n "${{ github.event.inputs.piso_criticidade }}" ]; then
            ARGS="$ARGS --piso-criticidade ${{ github.event.inputs.piso_criticidade }}"
          fi
          python main.py $ARGS
