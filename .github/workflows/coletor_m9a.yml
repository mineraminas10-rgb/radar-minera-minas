name: Coletor M9A - Movimentacoes ANM

# Cadência não é fixada de forma explícita na Carta Operacional M9A (ela
# fala em "execução recorrente" e "reconciliação em nova data", sem cravar
# uma frequência como a do M8). Comecei com diário à noite (horário de
# menor tráfego) — CONFIRMAR com a Rapha se ela prefere outra cadência
# (ex.: semanal, já que o SCM não deve atualizar todo dia).
on:
  schedule:
    - cron: '0 3 * * *'   # 00h em Brasília (UTC-3), todos os dias
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente (piloto | homologacao | producao)'
        required: false
        default: 'piloto'
      limite_casos:
        description: 'Processar só os N primeiros casos consolidados (deixar vazio para todos)'
        required: false
        default: ''

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r coletores/m9a_movimentacoes/requirements.txt

      - name: Rodar testes (não pode divergir da carta nem da regra de classificação SCM)
        working-directory: coletores/m9a_movimentacoes
        run: |
          python -m unittest test_scoring.py -v
          python -m unittest test_consolidacao.py -v
          python -m unittest test_classificacao_scm.py -v
          python -m unittest test_signals.py -v
          python -m unittest test_checklist_editorial.py -v

      - name: Baixar e descompactar microdados SCM
        working-directory: coletores/m9a_movimentacoes
        run: |
          # URL confirmada em 01/10/2026 (Rapha): dump relacional oficial
          # da ANM, ~198MB compactado, ~28 arquivos .txt ';'-delimitados em
          # ISO-8859-1 (ver docstring de ingestao_scm.py para o detalhe de
          # cada tabela e o que já foi confirmado contra uma amostra real).
          curl -sSL -o microdados-scm.zip https://dadosabertos.anm.gov.br/SCM/microdados/microdados-scm.zip
          mkdir -p microdados-scm
          unzip -q microdados-scm.zip -d microdados-scm

          # O zip pode extrair os .txt direto na raiz da pasta ou dentro de
          # uma subpasta própria — localiza o diretório real que contém
          # Processo.txt em vez de assumir um caminho fixo.
          CAMINHO_PROCESSO=$(find microdados-scm -iname 'Processo.txt' -print -quit)
          if [ -z "$CAMINHO_PROCESSO" ]; then
            echo "Processo.txt não encontrado depois de descompactar — o formato do zip oficial mudou desde 28/09/2026, revisar ingestao_scm.py."
            exit 1
          fi
          DIR_MICRODADOS=$(dirname "$CAMINHO_PROCESSO")
          echo "Diretório de microdados: $DIR_MICRODADOS"
          echo "DIR_MICRODADOS=$DIR_MICRODADOS" >> "$GITHUB_ENV"

      - name: Rodar coletor
        working-directory: coletores/m9a_movimentacoes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # AVISO (01/10/2026, não bloqueante): ProcessoEvento.txt sozinho
          # descompacta para ~1GB e carregar_microdados_scm() ainda não faz
          # streaming — carregar o dump completo de uma vez em pandas pode
          # ser lento ou pesado demais para o runner padrão do GitHub
          # Actions. Rodar a primeira execução real com --limite-casos
          # pequeno (via workflow_dispatch) antes de confiar no cron
          # noturno sem supervisão. Ver aviso igual em ingestao_scm.py.
          ARGS="--microdados $DIR_MICRODADOS --ambiente ${{ github.event.inputs.ambiente || 'piloto' }}"
          if [ -n "${{ github.event.inputs.limite_casos }}" ]; then
            ARGS="$ARGS --limite-casos ${{ github.event.inputs.limite_casos }}"
          fi
          python main.py $ARGS
